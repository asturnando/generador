; =============================================================================
; platformio.ini · Cómo compilar y cargar el firmware
; =============================================================================
; PlatformIO lee este archivo para saber para qué placa es el programa, qué
; bibliotecas necesita y cómo cargarlo. Las líneas que empiezan por ";" son
; comentarios y no tienen efecto.
; =============================================================================

[platformio]
; Configuración que se usa al pulsar Build/Upload sin elegir ninguna.
default_envs = nando_s3_uart

; Un "entorno" (env) agrupa todos los ajustes para una placa concreta.
; Nombre: placa de Nando, ESP32-S3, cargada por el conector UART.
[env:nando_s3_uart]
; Herramientas de Espressif (fabricante de la ESP32). Versión fija, para que
; el resultado sea el mismo en cualquier ordenador y en cualquier fecha.
platform = espressif32@6.12.0
; Modelo de placa: ESP32-S3-DevKitC-1 o compatibles.
board = esp32-s3-devkitc-1
; Se programa con el entorno de Arduino (setup, loop, Serial...).
framework = arduino
; Perfil provisional para la placa fotografiada N16R8. No activa PSRAM.
; DIO a 80 MHz y partición de 4 MB: no dependemos de toda la memoria anunciada.
; (N16R8 = 16 MB de flash y 8 MB de PSRAM. Usar solo 4 MB y un modo de acceso
; conservador hace que el mismo firmware funcione también en placas con
; menos memoria o con otra variante del módulo.)
; Modo de lectura de la memoria flash: DIO (2 líneas de datos), el más compatible.
board_build.flash_mode = dio
; Velocidad de la memoria flash: 80 MHz.
board_build.f_flash = 80000000L
; Tamaño de flash que se da por supuesto al cargar.
board_upload.flash_size = 4MB
; Reparto estándar de la memoria de 4 MB (programa, ajustes y datos).
board_build.partitions = default.csv
; Opciones que se pasan al compilador:
;   ARDUINO_USB_CDC_ON_BOOT=0: los mensajes de Serial salen por el conector
;     UART, no por el USB nativo. Así se ven en el mismo cable con el que se
;     carga el firmware.
;   CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1: solo se puede conectar un móvil a la
;     vez, para que nunca haya dos personas enviando órdenes a la vez.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
; Velocidad del monitor serie; debe coincidir con Serial.begin(115200) en main.cpp.
monitor_speed = 115200
; Las líneas DTR y RTS del puerto serie están conectadas a los botones de
; reinicio y arranque de la placa. Ponerlas a 0 evita que abrir el monitor
; reinicie la placa o la deje en modo de carga.
monitor_dtr = 0
monitor_rts = 0
; Velocidad de carga del firmware: lenta pero fiable con cualquier cable.
upload_speed = 115200
; Bibliotecas que PlatformIO descarga automáticamente, con versión fija:
;   NimBLE-Arduino: Bluetooth Low Energy.
;   Adafruit INA219: sensor de tensión y corriente.
;   Adafruit BusIO: la necesita la biblioteca del INA219 para usar I2C.
lib_deps =
    h2zero/NimBLE-Arduino@2.3.6
    adafruit/Adafruit INA219@1.2.3
    adafruit/Adafruit BusIO@1.17.4
